<form (ngSubmit)="onSubmit(titleElement.value, textInput.value)" #form>
    <app-control label="Title">
        <input id="title" name="title" #titleElement/>
    </app-control>
    <app-control label="Request">
        <textarea name="request" id="request" rows="3" #textInput></textarea>
    </app-control>
    <p>
        <button appButton>
            Submit
            <span ngProjectAs="icon">⌲</span>
        </button>
    </p>
</form>
